[project]
name = "prometheus-20"
version = "0.1.0"
description = "Прометей 2.0 job pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "eval-type-backport>=0.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "tenacity>=8.2.0",
  "python-dotenv>=1.0.0",
  "supabase>=2.4.0",
  "pyyaml>=6.0.0",
  "rapidfuzz>=3.6.0",
  "dateparser>=1.2.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
migrate = [
  "psycopg[binary]>=3.2.0",
]
crawl = [
  "playwright>=1.40.0",
  "python-jobspy>=1.1.0",
]
dev = [
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pre-commit>=3.6.0",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["backend"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
