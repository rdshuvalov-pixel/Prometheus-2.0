resume_md: |
  # Ruslan Shuvalov — Senior Product Manager

  **Роль:** Senior Product Manager | FinTech | B2B SaaS | AI products  
  **Локация:** Portugal (near Lisbon) | EU citizen | **Формат:** remote preferred, EU / hybrid Lisbon  
  **Языки:** English B2+, Russian (native)

  ## Summary
  Senior PM с сильным финтех- и B2B SaaS-бэкграундом: монетизация и рост ARPU, платформы для масштабируемого обслуживания клиентов,
  запуск новых продуктовых линеек (0→1), встраивание AI в поддержку и операционные процессы. Комфортно работаю с метриками,
  discovery и кросс-функциональными командами (engineering, CS, sales).

  ## Selected impact
  - **UDP Auto** (B2B SaaS для автодилеров): **ARPU +90%** за счёт аналитики, монетизации и контекстного апсейла; база пользователей **3 000 → 9 000**; выручка **14M → 27M RUB/квартал** за 3 месяца.
  - **Unlimit** (FinTech, Cyprus): перестроил архитектуру поддержки, запустил **AI-чатбот (RAG + Claude Sonnet + AWS Bedrock)**; **46%** обращений закрывает агент; время решения **2.5 дня → 6 часов** при росте объёма **+43%**.
  - **InSales** (e-commerce SaaS): новый субпродукт (cloud fiscal) **0 → 2.4M RUB/мес**; **+31%** к вкладу в выручку компании.
  - **KeepRise:** **0→1** product discovery, roadmap и **финмодель** под инвестиционный раунд.

  ## Домены и навыки
  FinTech / платежи и самообслуживание, B2B SaaS и e-commerce платформы, монетизация (pricing, packaging), growth и PLG-воронки,
  данные (SQL, когорты, эксперименты), интеграции и API, AI в продукте (LLM, RAG).

  ## Инструменты
  Jira, Linear, Figma (review), аналитика и BI, SQL, Notion.

interview_md: |
  ## STAR — кейсы (данные из операционного опыта)

  ### 1. Монетизация и ARPU — UDP Auto (B2B SaaS для дилеров)
  **S:** Продукт для автодилеров с потенциалом монетизации через пакеты и контекстный апсейл, но слабая динамика ARPU.
  **T:** Существенно поднять ARPU и масштаб базы без разрушения unit-экономики.
  **A:** Аналитика сегментов, стратегия монетизации, контекстный upsell, итерации по ценностным пакетам; совместно с sales/CS.
  **R:** **ARPU +90%**; пользователи **3 000 → 9 000**; выручка **14M → 27M RUB/квартал** за 3 месяца.

  ### 2. Discovery и roadmap (общий паттерн)
  **S:** Поток фич без явной связи с retention и выручкой.
  **T:** Сфокусировать roadmap на измеримых outcomes (активация, удержание, монетизация).
  **A:** Интервью с пользователями, приоритизация по impact, отсечение фич без метрик успеха.
  **R:** Предсказуемые релизы и меньше споров без цифр.

  ### 3. FinTech и операционная эффективность — Unlimit
  **S:** Ручная нагрузка на поддержку в растущем FinTech-контуре.
  **T:** Ускорить resolution при растущем объёме обращений.
  **A:** Новая архитектура поддержки, запуск AI-чата (**RAG + Claude Sonnet + AWS Bedrock**), качество ответов и обратная связь от CS.
  **R:** Время решения **2.5 дня → 6 часов**, **46%** запросов закрывает агент; объём **+43%** без пропорционального роста штата.

  ### 4. AI в продукте — Unlimit
  **S:** Нужно масштабировать первую линию без линейного роста затрат.
  **T:** Автоматизировать типовые кейсы с контролем качества и эскалацией.
  **A:** RAG, выбор модели (Claude Sonnet), Bedrock, guardrails, метрики качества и доля deflection.
  **R:** **46%** обращений закрывает AI-агент при улучшении времени до решения.

  ### 5. Новый продукт внутри платформы — InSales
  **S:** Ниша cloud fiscal / смежный продукт для базы SaaS-клиентов.
  **T:** Вывести новый субпродукт из нуля в стабильную выручку.
  **A:** Discovery, MVP, запуск, упаковка ценности, совместная работа с GTM.
  **R:** **0 → 2.4M RUB/мес**; **+31%** вклад в выручку компании.

  ### 6. Кросс-функциональная доставка
  **S:** Зависимости между Legal, Compliance и продуктом тормозят релизы.
  **T:** Предсказуемые релизы без сюрпризов в последнюю неделю.
  **A:** Ранние синки, чеклисты compliance-driven фич, явная трассировка требований.
  **R:** Меньше откатов и более стабильный темп поставки.

  ### 7. Метрики и эксперименты
  **S:** Приоритеты спорят без общей картины метрик.
  **T:** Единые north-star и guardrails для экспериментов.
  **A:** Договорённости по метрикам, стандарты A/B, прозрачные дашборды.
  **R:** Быстрее решения и воспроизводимые эксперименты.

  ### 8. 0→1 и инвестиции — KeepRise
  **S:** Продукт на стадии формирования гипотез и упаковки под раунд.
  **T:** Сформировать цельную историю для инвесторов: продукт + экономика.
  **A:** Product discovery, roadmap, **финансовая модель** под раунд.
  **R:** Согласованный пакет для fundraising и понятный план развития продукта.

