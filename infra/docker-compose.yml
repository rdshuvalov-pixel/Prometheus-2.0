services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped

  pipeline:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file:
      - ../.env
    entrypoint: ["python", "-m", "backend.pipeline.run_crawl", "--tier", "1"]
    profiles:
      - manual
