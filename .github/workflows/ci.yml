name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install hatchling pip setuptools wheel
          pip install -e ".[dev,crawl]"
      - name: Ruff
        run: pip install ruff && ruff check backend
      - name: Pytest
        run: pytest backend/tests -q
